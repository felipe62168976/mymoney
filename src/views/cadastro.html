<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Criar conta · MyMoney</title>
<script src="/js/theme.js"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<main class="auth-page">
  <section class="auth-card">
    <a class="logo" href="/"><span class="logo-icon" data-icon="wallet"></span>MyMoney</a>
    <h1>Criar sua conta</h1>
    <form class="form" id="form-cadastro">
      <div class="field"><label for="nome">Nome completo</label><input id="nome" name="nome" autocomplete="name" minlength="3" maxlength="100" required autofocus></div>
      <div class="field"><label for="email">E-mail</label><input id="email" name="email" type="email" autocomplete="email" required></div>
      <div class="field"><label for="senha">Senha (mínimo 8 caracteres)</label>
        <div class="senha-wrap"><input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" data-senha required>
        <button class="icon-btn" type="button" data-toggle-senha aria-label="Mostrar ou ocultar senhas" aria-pressed="false"></button></div></div>
      <div class="field"><label for="confirmacao">Confirmar senha</label><input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" data-senha required></div>
      <p class="form-erro" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">Criar conta</button>
    </form>
    <p class="auth-rodape">Já tem conta? <a href="/login">Entrar</a></p>
  </section>
</main>
<script src="/js/script.js" defer></script>
</body>
</html>
